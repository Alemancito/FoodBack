<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FoodBack{% endblock %}</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --fb-orange: #ff7a1a;
      --fb-orange-dark: #d85b05;
      --fb-ink: #121418;
      --fb-ink-soft: #21252b;
      --fb-paper: #fbfaf7;
      --fb-line: #ebe7df;
      --fb-muted: #6f737a;
      --fb-success: #14855f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--fb-ink);
      background:
        radial-gradient(circle at 12% 4%, rgba(255,122,26,.12), transparent 23rem),
        radial-gradient(circle at 92% 0%, rgba(18,20,24,.05), transparent 27rem),
        var(--fb-paper);
    }

    a { color: var(--fb-orange-dark); }

    .legal-shell {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    .fb-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .fb-brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      text-decoration: none;
      color: var(--fb-ink);
    }

    .fb-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(145deg, var(--fb-ink), #252a31);
      box-shadow: 0 10px 24px rgba(18,20,24,.18);
      font-weight: 900;
      letter-spacing: -.04em;
      position: relative;
      overflow: hidden;
    }

    .fb-mark::after {
      content: "";
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--fb-orange);
      position: absolute;
      right: -8px;
      bottom: -8px;
    }

    .fb-brand-title {
      font-weight: 850;
      letter-spacing: -.02em;
      line-height: 1.1;
    }

    .fb-brand-sub {
      color: var(--fb-muted);
      font-size: .84rem;
      margin-top: 3px;
    }

    .top-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--fb-line);
      border-radius: 999px;
      color: var(--fb-ink-soft);
      text-decoration: none;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(10px);
      font-size: .9rem;
      transition: .18s ease;
    }

    .top-link:hover {
      color: var(--fb-ink);
      transform: translateY(-1px);
      border-color: rgba(255,122,26,.35);
    }

    .legal-card {
      border: 1px solid rgba(18,20,24,.045);
      border-radius: 30px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 24px 70px rgba(22,24,28,.09);
      overflow: hidden;
    }

    .hero-accent {
      height: 4px;
      background: linear-gradient(90deg, var(--fb-orange), #ffb36f 40%, transparent 82%);
    }

    .legal-inner {
      padding: clamp(26px, 5vw, 58px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,122,26,.10);
      color: #a84600;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .display-title {
      max-width: 780px;
      margin-top: 18px;
      margin-bottom: 12px;
      font-weight: 880;
      letter-spacing: -.045em;
      line-height: 1.04;
      font-size: clamp(2rem, 4vw, 3.45rem);
    }

    .lead-copy {
      max-width: 770px;
      color: var(--fb-muted);
      font-size: 1.04rem;
      line-height: 1.7;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 34px;
    }

    .trust-item {
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 21px;
      color: var(--fb-ink);
      text-decoration: none;
      border: 1px solid var(--fb-line);
      border-radius: 21px;
      background: #fff;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .trust-item:hover {
      color: var(--fb-ink);
      transform: translateY(-3px);
      border-color: rgba(255,122,26,.42);
      box-shadow: 0 16px 35px rgba(26,28,31,.08);
    }

    .trust-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #f5f3ee;
      font-size: 1.15rem;
    }

    .trust-item:hover .trust-icon {
      color: #fff;
      background: var(--fb-orange);
    }

    .trust-name {
      font-weight: 820;
      margin-top: 18px;
      font-size: 1.05rem;
    }

    .trust-meta {
      color: var(--fb-muted);
      font-size: .84rem;
      margin-top: 5px;
      line-height: 1.45;
    }

    .trust-arrow {
      color: var(--fb-orange-dark);
      font-size: 1.05rem;
    }

    .acceptance-row {
      padding: 18px 20px;
      border: 1px solid var(--fb-line);
      border-radius: 19px;
      background: #fff;
    }

    .status-ok {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      color: #0b6b4a;
      background: #e9f7f1;
      font-size: .82rem;
      font-weight: 760;
    }

    .status-pending {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      color: #945000;
      background: #fff2df;
      font-size: .82rem;
      font-weight: 760;
    }

    .btn-foodback {
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: var(--fb-ink);
      padding: 11px 18px;
      font-weight: 760;
      box-shadow: 0 10px 24px rgba(18,20,24,.12);
    }

    .btn-foodback:hover {
      color: #fff;
      background: #282c32;
    }

    .legal-content {
      max-width: 820px;
      white-space: pre-wrap;
      line-height: 1.85;
      color: #373b40;
      font-size: 1rem;
    }

    .document-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 22px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--fb-line);
    }

    .version-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 999px;
      color: #9f4100;
      background: rgba(255,122,26,.10);
      font-size: .8rem;
      font-weight: 780;
    }

    .legal-alert {
      border: 1px solid #b9e5d4;
      border-radius: 17px;
      color: #0c6245;
      background: #ebf8f3;
      padding: 15px 17px;
    }

    .footer-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 20px;
      padding: 16px 4px 0;
      color: var(--fb-muted);
      font-size: .84rem;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .footer-links a {
      color: #686c72;
      text-decoration: none;
    }

    .footer-links a:hover { color: var(--fb-orange-dark); }

    .form-check-input:checked {
      background-color: var(--fb-orange);
      border-color: var(--fb-orange);
    }

    .message-wrap .alert {
      border: 0;
      border-radius: 17px;
      box-shadow: 0 10px 25px rgba(18,20,24,.04);
    }

    @media (max-width: 720px) {
      .legal-shell { width: min(100% - 20px, 1120px); padding-top: 18px; }
      .fb-topbar { align-items: flex-start; }
      .top-link span { display: none; }
      .trust-grid { grid-template-columns: 1fr; }
      .legal-card { border-radius: 24px; }
      .acceptance-row .d-flex { align-items: flex-start !important; }
    }
  </style>
</head>
<body>
  <main class="legal-shell">
    <header class="fb-topbar">
      <a href="{% url 'legal_center' %}" class="fb-brand">
        <span class="fb-mark">FB</span>
        <span>
          <span class="fb-brand-title d-block">FoodBack</span>
          <span class="fb-brand-sub d-block">Centro de confianza</span>
        </span>
      </a>

      <a class="top-link" href="{% url 'support_public' %}">
        <i class="bi bi-life-preserver"></i>
        <span>Ayuda y soporte</span>
      </a>
    </header>

    {% if messages %}
      <div class="message-wrap mb-3">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'secondary' }} mb-2">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}

    <footer class="footer-card">
      <span>FoodBack · información legal y de confianza</span>
      <nav class="footer-links">
        <a href="{% url 'legal_document' 'terminos' %}">Términos</a>
        <a href="{% url 'legal_document' 'privacidad' %}">Privacidad</a>
        <a href="{% url 'legal_document' 'cookies' %}">Cookies</a>
        <a href="{% url 'security_public' %}">Seguridad</a>
        <a href="{% url 'support_public' %}">Soporte</a>
      </nav>
    </footer>
  </main>
</body>
</html>
