<!DOCTYPE html>
<html lang="es">
<head>
    <title>Reparto | FoodBack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --color-accent: #D35400;
            --color-accent-glow: rgba(211, 84, 0, 0.5);
            --bg-body: #121212;
            --bg-card: #1E1E1E;
            --text-main: #FFFFFF;
            --text-sec: #B0B0B0;
        }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Poppins', sans-serif; padding: 15px; overflow-x: hidden; }

        /* HEADER APP */
        .delivery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .user-badge { background: #2a2a2a; color: #eee; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; border: 1px solid #444; }

        /* BOTÓN LOGOUT PREMIUM */
        .btn-logout-premium { width: 38px; height: 38px; border-radius: 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; cursor: pointer; }
        .btn-logout-premium:hover, .btn-logout-premium:active { background: #ef4444; color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); transform: scale(1.05); border-color: #ef4444; }

        .section-header { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-sec); margin-bottom: 15px; font-weight: 700; }

        /* --- TARJETA MOCHILA --- */
        .backpack-card { background: linear-gradient(145deg, #1f1f1f, #181818); border-radius: 20px; padding: 25px 20px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .backpack-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-accent); }
        .order-id { font-size: 1.8rem; font-weight: 800; color: white; line-height: 1; }
        .customer-name { font-size: 1.2rem; font-weight: 600; color: #eee; margin-top: 5px; }
        
        .address-box { background: #252525; padding: 12px; border-radius: 12px; margin: 15px 0; color: #ddd; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; }

        .money-alert { background: rgba(46, 204, 113, 0.1); color: #2ecc71; border: 1px dashed #2ecc71; padding: 10px; border-radius: 10px; text-align: center; font-weight: 700; margin-bottom: 15px; }
        .card-alert { background: rgba(0, 229, 255, 0.15); color: #00E5FF; border: 1px solid #00E5FF; padding: 10px; border-radius: 10px; text-align: center; font-weight: 700; margin-bottom: 15px; text-transform: uppercase; font-size: 0.9rem; box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); }

        .product-toggle { background: rgba(255, 255, 255, 0.05); border: 1px solid #333; width: 100%; padding: 10px; border-radius: 10px; color: #ccc; font-size: 0.85rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; cursor: pointer; user-select: none; }
        .product-list { display: none; background: #181818; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .prod-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #333; font-size: 0.85rem; color: #ddd; }
        .prod-row:last-child { border-bottom: none; }
        .qty-tag { background: #333; padding: 2px 6px; border-radius: 4px; font-weight: 700; margin-right: 8px; font-size: 0.8rem; color: white;}

        .btn-map { background: #2a2a2a; color: #ccc; border: 1px solid #3a3a3a; padding: 10px; border-radius: 10px; width: 48%; text-decoration: none; text-align: center; font-weight: 500; font-size: 0.9rem; }
        .btn-map:hover { background: #3a3a3a; color: white; }

        .actions-row { display: flex; gap: 10px; margin-top: 15px; }
        .secondary-actions { margin-top: 10px; }
        .btn-success-custom { flex-grow: 2; background: #27ae60; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; }
        .btn-release-custom { flex-grow: 2; background: #2f2f2f; color: #f5f5f5; border: 1px solid #4a4a4a; padding: 13px; border-radius: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-release-custom:hover, .btn-release-custom:active { background: #3a3a3a; color: white; border-color: #666; }
        .btn-error-custom { flex-grow: 1; background: #c0392b; color: white; border: none; padding: 13px; border-radius: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

        .pool-card { background: #1E1E1E; border-radius: 16px; padding: 15px; margin-bottom: 12px; border: 1px solid #333; }
        .pool-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-take { border: 1px solid var(--color-accent); color: var(--color-accent); background: transparent; padding: 6px 18px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; }

        .swal2-popup.swal2-dark-custom { background: #1E1E1E !important; color: #eee !important; border: 1px solid #333 !important; }
        .swal2-title, .swal2-content { color: #eee !important; }
    </style>
</head>
<body>

    <div class="delivery-header">
        <h4 class="m-0 fw-bold text-white">FoodBack <span style="color:var(--color-accent)">.Go</span></h4>
        <div class="d-flex align-items-center gap-2">
            <div class="user-badge"><i class="bi bi-person-circle me-1"></i> {{ user.username }}</div>
            <form id="logoutForm" action="{% url 'logout' %}" method="POST" class="d-inline">
                {% csrf_token %}
                <button type="button" class="btn-logout-premium" onclick="confirmarSalida()">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="section-header text-warning"><i class="bi bi-bag-check-fill me-2"></i> Pedidos en curso</div>
    
    <div id="zona-mochila">
        {% include 'pedidos/partials/delivery_mochila.html' %}
    </div>

    <div class="my-4 border-bottom border-secondary opacity-25"></div>

    <div class="section-header text-info"><i class="bi bi-shop me-2"></i> Listos para recoger</div>
    
    <div id="zona-pool">
        {% include 'pedidos/partials/delivery_pool.html' %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // 1. SONIDOS
        const audioAlerta = new Audio('https://assets.mixkit.co/active_storage/sfx/996/996-preview.mp3');

        document.addEventListener('click', function() {
            audioAlerta.load();
        }, { once: true });

        function confirmarSalida() {
            Swal.fire({
                title: '¿Cerrar sesión?',
                text: "¿Ya terminaste tu turno por hoy?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, salir',
                cancelButtonText: 'Cancelar',
                background: '#1E1E1E',
                color: '#ffffff',
                iconColor: '#ef4444',
                reverseButtons: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#333333'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('logoutForm').submit();
                }
            });
        }

        function confirmarEntrega(form, pedidoId) {
            Swal.fire({
                title: '¿Pedido entregado?',
                html: `Confirma que el pedido <b>#${pedidoId}</b> ya fue entregado al cliente.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sí, ya lo entregué',
                cancelButtonText: 'Cancelar',
                background: '#1E1E1E',
                color: '#ffffff',
                iconColor: '#27ae60',
                confirmButtonColor: '#27ae60',
                cancelButtonColor: '#333333',
                reverseButtons: true,
                focusCancel: true
            }).then((result) => {
                if (result.isConfirmed) {
                    pausePolling();
                    form.submit();
                }
            });

            return false;
        }

        function confirmarSoltar(form, pedidoId) {
            Swal.fire({
                title: '¿Quitar de tu mochila?',
                html: `El pedido <b>#${pedidoId}</b> volverá a la lista de disponibles para que otro repartidor pueda tomarlo.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Sí, quitarlo',
                cancelButtonText: 'Cancelar',
                background: '#1E1E1E',
                color: '#ffffff',
                iconColor: '#f59e0b',
                confirmButtonColor: '#D35400',
                cancelButtonColor: '#333333',
                reverseButtons: true,
                focusCancel: true
            }).then((result) => {
                if (result.isConfirmed) {
                    pausePolling();
                    form.submit();
                }
            });

            return false;
        }

        function toggleDetails(id, btn) {
            const el = document.getElementById(id);
            const icon = btn.querySelector('.bi-chevron-down') || btn.querySelector('.bi-chevron-up');

            if (!el) return;

            if (el.style.display === 'block') {
                el.style.display = 'none';

                if (icon) {
                    icon.classList.remove('bi-chevron-up');
                    icon.classList.add('bi-chevron-down');
                }

            } else {
                el.style.display = 'block';

                if (icon) {
                    icon.classList.remove('bi-chevron-down');
                    icon.classList.add('bi-chevron-up');
                }
            }
        }

        function sonarAlerta() {
            audioAlerta.currentTime = 0;
            audioAlerta.play().catch(e => console.log("Audio esperando interacción."));
        }

        const Toast = Swal.mixin({
            toast: true,
            position: 'top',
            showConfirmButton: false,
            timer: 3000,
            background: '#333',
            color: '#fff'
        });

        {% if messages %}
            {% for message in messages %}
                Toast.fire({
                    icon: 'success',
                    title: "{{ message }}"
                });
            {% endfor %}
        {% endif %}

        // 2. POLLING OPTIMIZADO
        let deliveryLastUpdate = "{{ last_update|default:'none' }}";
        let pedidosEnMemoria = {{ disponibles|length }};

        let isPaused = false;
        let pollingDelay = 5000;
        const MIN_DELAY = 5000;
        const MAX_DELAY = 20000;
        let pollingTimer = null;

        function pausePolling() {
            isPaused = true;
        }

        document.addEventListener('mousedown', () => {
            isPaused = true;
        });

        document.addEventListener('mouseup', () => {
            setTimeout(() => {
                isPaused = false;
            }, 1000);
        });

        function scheduleNextDeliveryPoll(delay = pollingDelay) {
            clearTimeout(pollingTimer);
            pollingTimer = setTimeout(syncDeliveryDashboard, delay);
        }

        function guardarListasAbiertas() {
            let listasAbiertas = [];

            document.querySelectorAll('.product-list').forEach(el => {
                if (el.style.display === 'block') {
                    listasAbiertas.push(el.id);
                }
            });

            return listasAbiertas;
        }

        function restaurarListasAbiertas(listasAbiertas) {
            listasAbiertas.forEach(id => {
                const el = document.getElementById(id);

                if (el) {
                    el.style.display = 'block';

                    const btn = document.querySelector(`[onclick*="${id}"]`);

                    if (btn) {
                        const icon = btn.querySelector('.bi-chevron-down');

                        if (icon) {
                            icon.classList.remove('bi-chevron-down');
                            icon.classList.add('bi-chevron-up');
                        }
                    }
                }
            });
        }

        function syncDeliveryDashboard() {
            if (isPaused) {
                scheduleNextDeliveryPoll(MIN_DELAY);
                return;
            }

            if (document.hidden) {
                scheduleNextDeliveryPoll(30000);
                return;
            }

            const listasAbiertas = guardarListasAbiertas();

            const url = new URL("{% url 'api_delivery_sync' %}", window.location.origin);
            url.searchParams.set('last_update', deliveryLastUpdate || 'none');

            fetch(url, {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (!data.changed) {
                    pollingDelay = Math.min(pollingDelay + 3000, MAX_DELAY);
                    scheduleNextDeliveryPoll();
                    return;
                }

                deliveryLastUpdate = data.last_update || deliveryLastUpdate;
                pollingDelay = MIN_DELAY;

                const nuevosPool = data.pool_count || 0;

                if (nuevosPool > pedidosEnMemoria) {
                    sonarAlerta();

                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200]);
                    }

                    Swal.fire({
                        title: '¡Nuevo Pedido!',
                        text: 'Revisa la lista de disponibles',
                        icon: 'info',
                        timer: 3000,
                        showConfirmButton: false,
                        background: '#1E1E1E',
                        color: '#fff'
                    });
                }

                pedidosEnMemoria = nuevosPool;

                if (data.html) {
                    Object.keys(data.html).forEach(id => {
                        const actual = document.getElementById(id);

                        if (actual && actual.innerHTML !== data.html[id]) {
                            actual.innerHTML = data.html[id];
                        }
                    });
                }

                restaurarListasAbiertas(listasAbiertas);
                scheduleNextDeliveryPoll();
            })
            .catch(e => {
                console.log("Conexión inestable...");
                pollingDelay = Math.min(pollingDelay + 5000, 30000);
                scheduleNextDeliveryPoll();
            });
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                pollingDelay = MIN_DELAY;
                scheduleNextDeliveryPoll(1000);
            }
        });

        scheduleNextDeliveryPoll(3000);
    </script>

</body>
</html>
