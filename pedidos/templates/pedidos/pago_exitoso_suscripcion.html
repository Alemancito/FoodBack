{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago confirmado</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #111827;
            background:
                radial-gradient(circle at 20% 15%, rgba(46, 204, 113, 0.28), transparent 32%),
                radial-gradient(circle at 80% 20%, rgba(211, 84, 0, 0.16), transparent 30%),
                linear-gradient(135deg, #f8fafc, #eef2f7);
        }

        .card-success {
            width: min(94vw, 460px);
            background: white;
            border-radius: 30px;
            padding: 38px 28px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.12);
            border: 1px solid rgba(15, 23, 42, 0.06);
        }

        .check-icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #2ecc71, #22c55e);
            color: white;
            font-size: 3.8rem;
            box-shadow: 0 18px 45px rgba(46,204,113,0.32);
            animation: pop 0.55s ease;
        }

        h1 {
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            line-height: 1.6;
        }

        .btn-dark {
            border-radius: 18px;
            padding: 14px 18px;
            font-weight: 800;
        }

        @keyframes pop {
            0% { transform: scale(0.65); opacity: 0; }
            70% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <main class="card-success">
        <div class="check-icon"><i class="bi bi-check-lg"></i></div>
        <h1>Pago confirmado</h1>
        <p>La suscripción fue renovada correctamente. El servicio ya puede continuar funcionando con normalidad.</p>
        <a href="{% url 'dashboard_admin' %}" class="btn btn-dark btn-lg w-100 mt-3">
            Volver al Dashboard
        </a>
    </main>
</body>
</html>
