{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando pago</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f8fafc;
            color: #111827;
        }

        .verify-card {
            width: min(94vw, 460px);
            background: white;
            border-radius: 30px;
            padding: 38px 28px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(15, 23, 42, 0.10);
        }

        .loader-ring {
            width: 86px;
            height: 86px;
            margin: 0 auto 24px;
            border-radius: 50%;
            border: 8px solid #f3f4f6;
            border-top-color: #D35400;
            animation: spin 0.9s linear infinite;
        }

        h1 { font-weight: 800; letter-spacing: -1px; }
        p { color: #6b7280; line-height: 1.6; }
        .btn-dark { border-radius: 18px; padding: 14px 18px; font-weight: 800; }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <main class="verify-card">
        <div class="loader-ring"></div>
        <h1>Verificando pago</h1>
        <p>Recibimos el regreso desde la pasarela. En unos momentos confirmaremos el pago de forma segura.</p>
        <a href="{% url 'dashboard_admin' %}" class="btn btn-dark btn-lg w-100 mt-3">
            Volver al Dashboard
        </a>
    </main>
</body>
</html>
