<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acceso | FoodBack</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    >

    <style>
        :root {
            --fb-orange: #D35400;
            --fb-orange-dark: #B94700;
            --fb-orange-soft: rgba(211, 84, 0, 0.08);

            --fb-dark: #1D232A;
            --fb-text: #313943;
            --fb-muted: #8B949E;

            --fb-bg: #F5F6F8;
            --fb-border: #E9ECEF;

            --fb-danger: #D9485F;
            --fb-danger-soft: rgba(217, 72, 95, 0.08);

            --fb-security: #7557E8;
            --fb-security-soft: rgba(117, 87, 232, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(211, 84, 0, 0.06),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(117, 87, 232, 0.05),
                    transparent 30%
                ),
                var(--fb-bg);

            color: var(--fb-text);

            font-family:
                'Poppins',
                sans-serif;
        }

        /* =========================================================
           CONTENEDOR
           ========================================================= */

        .login-shell {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            width: 100%;

            padding: 38px;

            background:
                rgba(255, 255, 255, 0.97);

            border:
                1px solid
                rgba(0, 0, 0, 0.035);

            border-radius: 26px;

            box-shadow:
                0 24px 70px
                rgba(32, 41, 50, 0.09);
        }

        /* =========================================================
           MARCA
           ========================================================= */

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 28px;
        }

        .brand-mark {
            width: 52px;
            height: 52px;

            margin-bottom: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #E46A19,
                    var(--fb-orange)
                );

            color: #fff;

            font-size: 1.45rem;

            box-shadow:
                0 10px 26px
                rgba(211, 84, 0, 0.22);
        }

        .brand-title {
            margin: 0;

            color: var(--fb-dark);

            font-size: 1.55rem;
            font-weight: 800;

            letter-spacing: -0.7px;
        }

        .brand-title span {
            color:
                var(--fb-orange);
        }

        .brand-subtitle {
            margin:
                4px
                0
                0;

            color:
                var(--fb-muted);

            font-size: 0.77rem;
            font-weight: 500;
        }

        /* =========================================================
           BLOQUE DE SEGURIDAD / 429
           ========================================================= */

        .security-alert {
            position: relative;

            margin-bottom: 20px;

            padding:
                15px
                15px
                15px
                15px;

            overflow: hidden;

            border:
                1px solid
                rgba(117, 87, 232, 0.16);

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(117, 87, 232, 0.075),
                    rgba(117, 87, 232, 0.025)
                );
        }

        .security-alert::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;
            bottom: 0;

            width: 4px;

            background:
                var(--fb-security);
        }

        .security-alert-main {
            display: flex;
            align-items: flex-start;

            gap: 12px;
        }

        .security-icon {
            width: 38px;
            height: 38px;

            flex: 0 0 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                rgba(117, 87, 232, 0.12);

            color:
                var(--fb-security);

            font-size: 1rem;
        }

        .security-content {
            min-width: 0;

            flex: 1;
        }

        .security-title {
            margin:
                1px
                0
                4px;

            color: #4938A8;

            font-size: 0.82rem;
            font-weight: 800;
        }

        .security-text {
            margin: 0;

            color: #68667A;

            font-size: 0.72rem;
            font-weight: 500;

            line-height: 1.55;
        }

        .security-countdown {
            margin-top: 10px;

            display: inline-flex;
            align-items: center;

            gap: 6px;

            padding:
                5px
                9px;

            border-radius: 8px;

            background:
                rgba(117, 87, 232, 0.09);

            color:
                #5945BC;

            font-size: 0.67rem;
            font-weight: 700;
        }

        /* =========================================================
           CREDENCIALES INCORRECTAS
           ========================================================= */

        .credentials-alert {
            margin-bottom: 18px;

            display: flex;
            align-items: center;

            gap: 9px;

            padding:
                11px
                13px;

            border:
                1px solid
                rgba(217, 72, 95, 0.13);

            border-radius: 13px;

            background:
                var(--fb-danger-soft);

            color:
                #B2384C;

            font-size: 0.72rem;
            font-weight: 600;
        }

        /* =========================================================
           CAMPOS
           ========================================================= */

        .field-group {
            margin-bottom: 15px;
        }

        .field-label {
            display: block;

            margin:
                0
                0
                7px
                2px;

            color: #69727C;

            font-size: 0.68rem;
            font-weight: 700;

            letter-spacing: 0.25px;
        }

        .field-wrapper {
            position: relative;
        }

        .field-icon {
            position: absolute;

            top: 50%;
            left: 15px;

            transform:
                translateY(-50%);

            color: #9BA2AA;

            font-size: 0.95rem;

            pointer-events: none;
        }

        .form-control.fb-control {
            width: 100%;
            height: 52px;

            padding:
                0
                44px
                0
                43px;

            border:
                1.5px solid
                var(--fb-border);

            border-radius: 14px;

            background:
                #F8F9FA;

            color:
                var(--fb-dark);

            font-family:
                'Poppins',
                sans-serif;

            font-size: 0.86rem;
            font-weight: 500;

            box-shadow: none;

            transition:
                border-color 0.2s ease,
                background-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-control.fb-control::placeholder {
            color: #A6ADB4;
        }

        .form-control.fb-control:hover {
            background: #fff;

            border-color:
                #DCE0E4;
        }

        .form-control.fb-control:focus {
            background: #fff;

            border-color:
                var(--fb-orange);

            box-shadow:
                0 0 0 4px
                rgba(211, 84, 0, 0.075);
        }

        /* =========================================================
           MOSTRAR CONTRASEÑA
           ========================================================= */

        .password-toggle {
            position: absolute;

            top: 50%;
            right: 8px;

            width: 37px;
            height: 37px;

            transform:
                translateY(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 10px;

            background:
                transparent;

            color: #939AA1;

            cursor: pointer;

            transition:
                background-color 0.15s ease,
                color 0.15s ease;
        }

        .password-toggle:hover {
            background:
                #EEF0F2;

            color:
                var(--fb-dark);
        }

        /* =========================================================
           BOTÓN LOGIN
           ========================================================= */

        .btn-login {
            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 14px;

            background:
                var(--fb-dark);

            color: #fff;

            font-family:
                'Poppins',
                sans-serif;

            font-size: 0.9rem;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;

            box-shadow:
                0 8px 20px
                rgba(29, 35, 42, 0.14);

            transition:
                transform 0.17s ease,
                background-color 0.17s ease,
                box-shadow 0.17s ease;
        }

        .btn-login:hover {
            background:
                #2D343C;

            color: #fff;

            transform:
                translateY(-1px);

            box-shadow:
                0 11px 25px
                rgba(29, 35, 42, 0.18);
        }

        .btn-login:active {
            transform:
                translateY(0);
        }

        .btn-login:disabled {
            background:
                #B6BBC0;

            box-shadow: none;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================================================
           VOLVER
           ========================================================= */

        .back-link-wrap {
            margin-top: 20px;

            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;

            gap: 6px;

            color:
                #818991;

            font-size: 0.72rem;
            font-weight: 500;

            text-decoration: none;

            transition:
                color 0.15s ease;
        }

        .back-link:hover {
            color:
                var(--fb-orange);
        }

        /* =========================================================
           PIE DE SEGURIDAD
           ========================================================= */

        .security-footer {
            margin-top: 21px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 6px;

            color: #ADB2B7;

            font-size: 0.61rem;
            font-weight: 500;
        }

        .security-footer i {
            color:
                #7D858D;
        }

        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 576px) {

            body {
                align-items:
                    flex-start;

                padding:
                    26px
                    16px;
            }

            .login-shell {
                max-width:
                    100%;
            }

            .login-card {
                margin-top:
                    7vh;

                padding:
                    30px
                    22px;

                border-radius:
                    22px;

                box-shadow:
                    0 18px 50px
                    rgba(32, 41, 50, 0.08);
            }

            .brand {
                margin-bottom:
                    25px;
            }

            .brand-mark {
                width: 48px;
                height: 48px;

                border-radius:
                    15px;
            }

            .brand-title {
                font-size:
                    1.4rem;
            }

            .security-alert {
                padding:
                    13px;
            }

            .security-text {
                font-size:
                    0.69rem;
            }
        }
    </style>
</head>


<body>

    <main class="login-shell">

        <section class="login-card">

            <!-- =================================================
                 MARCA
                 ================================================= -->

            <div class="brand">

                <div class="brand-mark">

                    <i
                        class="bi bi-grid-1x2-fill"
                        aria-hidden="true"
                    ></i>

                </div>


                <h1 class="brand-title">

                    Food<span>Back</span>

                </h1>


                <p class="brand-subtitle">
                    Panel de Gestión
                </p>

            </div>


            <!-- =================================================
                 BLOQUEO DE SEGURIDAD
                 ================================================= -->

            {% if rate_limit_error %}

                <div
                    class="security-alert"
                    role="alert"
                    id="rateLimitAlert"
                    data-retry-after="{{ rate_limit_retry_after|default:0 }}"
                >

                    <div class="security-alert-main">

                        <div class="security-icon">

                            <i
                                class="bi bi-shield-lock-fill"
                                aria-hidden="true"
                            ></i>

                        </div>


                        <div class="security-content">

                            <div class="security-title">
                                Acceso temporalmente limitado
                            </div>


                            <p class="security-text">
                                {{ rate_limit_error }}
                            </p>


                            <div
                                class="security-countdown"
                                id="rateLimitCountdown"
                            >

                                <i
                                    class="bi bi-clock"
                                    aria-hidden="true"
                                ></i>

                                <span id="rateLimitCountdownText">
                                    Calculando tiempo…
                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            {% elif form.errors %}

                <div
                    class="credentials-alert"
                    role="alert"
                >

                    <i
                        class="bi bi-exclamation-circle-fill"
                        aria-hidden="true"
                    ></i>

                    <span>
                        Usuario o contraseña incorrectos.
                    </span>

                </div>

            {% endif %}


            <!-- =================================================
                 LOGIN
                 ================================================= -->

            <form
                method="post"
                id="loginForm"
                novalidate
            >

                {% csrf_token %}


                <!-- Usuario -->

                <div class="field-group">

                    <label
                        for="id_username"
                        class="field-label"
                    >
                        Usuario
                    </label>


                    <div class="field-wrapper">

                        <i
                            class="
                                bi
                                bi-person
                                field-icon
                            "
                            aria-hidden="true"
                        ></i>


                        <input
                            type="text"
                            name="username"
                            id="id_username"
                            class="form-control fb-control"
                            placeholder="Ingresa tu usuario"
                            value="{{ form.username.value|default:'' }}"
                            autocomplete="username"
                            maxlength="150"
                            required
                        >

                    </div>

                </div>


                <!-- Contraseña -->

                <div class="field-group">

                    <label
                        for="id_password"
                        class="field-label"
                    >
                        Contraseña
                    </label>


                    <div class="field-wrapper">

                        <i
                            class="
                                bi
                                bi-lock
                                field-icon
                            "
                            aria-hidden="true"
                        ></i>


                        <input
                            type="password"
                            name="password"
                            id="id_password"
                            class="form-control fb-control"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Mostrar contraseña"
                        >

                            <i
                                class="bi bi-eye"
                                id="passwordToggleIcon"
                                aria-hidden="true"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- Botón -->

                <button
                    type="submit"
                    class="btn-login"
                    id="loginSubmit"
                    {% if rate_limit_error %}
                        disabled
                    {% endif %}
                >

                    <i
                        class="bi bi-box-arrow-in-right"
                        aria-hidden="true"
                    ></i>

                    <span id="loginButtonText">
                        Ingresar
                    </span>

                </button>


                <!-- Volver -->

                <div class="back-link-wrap">

                    <a
                        href="{% url 'menu' %}"
                        class="back-link"
                    >

                        <i
                            class="bi bi-arrow-left"
                            aria-hidden="true"
                        ></i>

                        Volver al menú

                    </a>

                </div>

            </form>


            <!-- =================================================
                 INDICADOR DE SEGURIDAD
                 ================================================= -->

            <div class="security-footer">

                <i
                    class="bi bi-shield-check"
                    aria-hidden="true"
                ></i>

                Acceso protegido por FoodBack

            </div>

        </section>

    </main>


    <script>
        /* =========================================================
           MOSTRAR / OCULTAR CONTRASEÑA
           ========================================================= */

        const passwordInput =
            document.getElementById(
                "id_password"
            );

        const passwordToggle =
            document.getElementById(
                "passwordToggle"
            );

        const passwordToggleIcon =
            document.getElementById(
                "passwordToggleIcon"
            );


        if (
            passwordInput &&
            passwordToggle &&
            passwordToggleIcon
        ) {

            passwordToggle.addEventListener(
                "click",
                function () {

                    const mostrando =
                        passwordInput.type ===
                        "text";


                    passwordInput.type =
                        mostrando
                            ? "password"
                            : "text";


                    passwordToggleIcon.className =
                        mostrando
                            ? "bi bi-eye"
                            : "bi bi-eye-slash";


                    passwordToggle.setAttribute(
                        "aria-label",
                        mostrando
                            ? "Mostrar contraseña"
                            : "Ocultar contraseña"
                    );
                }
            );
        }


        /* =========================================================
           CONTADOR DEL RATE LIMIT
           ========================================================= */

        const rateLimitAlert =
            document.getElementById(
                "rateLimitAlert"
            );

        const countdownText =
            document.getElementById(
                "rateLimitCountdownText"
            );

        const loginSubmit =
            document.getElementById(
                "loginSubmit"
            );

        const loginButtonText =
            document.getElementById(
                "loginButtonText"
            );


        if (
            rateLimitAlert &&
            countdownText
        ) {

            let secondsRemaining =
                parseInt(
                    rateLimitAlert.dataset.retryAfter ||
                    "0",
                    10
                );


            const renderCountdown =
                function () {

                    if (
                        secondsRemaining <= 0
                    ) {

                        countdownText.textContent =
                            "Ya puedes volver a intentarlo";


                        if (loginSubmit) {

                            loginSubmit.disabled =
                                false;
                        }


                        if (loginButtonText) {

                            loginButtonText.textContent =
                                "Intentar nuevamente";
                        }


                        return false;
                    }


                    const minutes =
                        Math.floor(
                            secondsRemaining / 60
                        );


                    const seconds =
                        secondsRemaining % 60;


                    const formattedSeconds =
                        String(
                            seconds
                        ).padStart(
                            2,
                            "0"
                        );


                    countdownText.textContent =
                        (
                            minutes > 0
                                ? `Intenta nuevamente en ${minutes}:${formattedSeconds}`
                                : `Intenta nuevamente en ${seconds}s`
                        );


                    return true;
                };


            renderCountdown();


            const countdownInterval =
                setInterval(
                    function () {

                        secondsRemaining -=
                            1;


                        const continuar =
                            renderCountdown();


                        if (!continuar) {

                            clearInterval(
                                countdownInterval
                            );
                        }

                    },
                    1000
                );
        }


        /* =========================================================
           EVITAR DOBLE SUBMIT VISUAL
           ========================================================= */

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        if (loginForm) {

            loginForm.addEventListener(
                "submit",
                function () {

                    if (
                        loginSubmit &&
                        !loginSubmit.disabled
                    ) {

                        loginSubmit.disabled =
                            true;


                        if (
                            loginButtonText
                        ) {

                            loginButtonText.textContent =
                                "Verificando…";
                        }
                    }
                }
            );
        }
    </script>

</body>

</html>
