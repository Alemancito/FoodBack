<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar contraseña | FoodBack</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    >

    <style>
        :root {
            --fb-orange: #D35400;
            --fb-dark: #1D232A;
            --fb-muted: #7F8790;
            --fb-bg: #F5F6F8;
            --fb-border: #E5E8EB;
            --fb-security: #7557E8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(211, 84, 0, 0.06),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(117, 87, 232, 0.05),
                    transparent 30%
                ),
                var(--fb-bg);

            font-family: "Poppins", sans-serif;
            color: var(--fb-dark);
        }

        .shell {
            width: 100%;
            max-width: 430px;
        }

        .card-reset {
            padding: 38px;

            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(0, 0, 0, 0.035);
            border-radius: 26px;

            box-shadow:
                0 24px 70px
                rgba(32, 41, 50, 0.09);
        }

        .brand {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #E46A19,
                    var(--fb-orange)
                );

            color: white;
            font-size: 1.4rem;
        }

        h1 {
            margin: 0 0 7px;

            font-size: 1.35rem;
            font-weight: 800;
        }

        .description {
            margin: 0;

            color: var(--fb-muted);
            font-size: 0.76rem;
            line-height: 1.6;
        }

        .alert-box {
            margin-bottom: 18px;
            padding: 13px 15px;

            border-radius: 13px;
            border: 1px solid rgba(117, 87, 232, 0.15);

            background:
                rgba(117, 87, 232, 0.06);

            color: #5945BC;

            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.5;
        }

        .countdown {
            margin-top: 8px;

            display: inline-flex;
            align-items: center;

            gap: 6px;

            color: #5945BC;

            font-size: 0.67rem;
            font-weight: 700;
        }

        label {
            display: block;

            margin:
                0
                0
                7px
                2px;

            color: #69727C;

            font-size: 0.68rem;
            font-weight: 700;
        }

        .field-wrapper {
            position: relative;
        }

        .field-icon {
            position: absolute;

            top: 50%;
            left: 15px;

            transform:
                translateY(-50%);

            color: #9BA2AA;
        }

        .form-control {
            height: 52px;

            padding:
                0
                15px
                0
                43px;

            border:
                1.5px solid
                var(--fb-border);

            border-radius: 14px;

            background: #F8F9FA;

            font-size: 0.85rem;
        }

        .form-control:focus {
            border-color:
                var(--fb-orange);

            box-shadow:
                0 0 0 4px
                rgba(211, 84, 0, 0.075);
        }

        .btn-submit {
            width: 100%;
            height: 52px;

            margin-top: 17px;

            border: none;
            border-radius: 14px;

            background:
                var(--fb-dark);

            color: white;

            font-size: 0.88rem;
            font-weight: 700;
        }

        .btn-submit:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

        .back a {
            color: #818991;

            font-size: 0.72rem;
            font-weight: 500;

            text-decoration: none;
        }

        .back a:hover {
            color:
                var(--fb-orange);
        }

        @media (max-width: 576px) {
            body {
                align-items: flex-start;
                padding: 26px 16px;
            }

            .card-reset {
                margin-top: 7vh;
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="card-reset">

            <div class="brand">
                <div class="brand-icon">
                    <i
                        class="bi bi-key-fill"
                        aria-hidden="true"
                    ></i>
                </div>

                <h1>
                    Recuperar contraseña
                </h1>

                <p class="description">
                    Escribe el correo asociado a tu
                    cuenta de FoodBack.
                </p>
            </div>

            {% if rate_limit_error %}
                <div
                    class="alert-box"
                    role="alert"
                    id="rateLimitAlert"
                    data-retry-after="{{ rate_limit_retry_after|default:0 }}"
                >
                    <div>
                        <i
                            class="bi bi-shield-lock"
                            aria-hidden="true"
                        ></i>

                        {{ rate_limit_error }}
                    </div>

                    <div
                        class="countdown"
                        id="rateLimitCountdown"
                    >
                        <i
                            class="bi bi-clock"
                            aria-hidden="true"
                        ></i>

                        <span id="rateLimitCountdownText">
                            Calculando tiempo…
                        </span>
                    </div>
                </div>
            {% endif %}

            <form
                method="post"
                id="passwordResetRequestForm"
                novalidate
            >
                {% csrf_token %}

                <label for="id_email">
                    Correo electrónico
                </label>

                <div class="field-wrapper">
                    <i
                        class="bi bi-envelope field-icon"
                        aria-hidden="true"
                    ></i>

                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        class="form-control"
                        autocomplete="email"
                        maxlength="254"
                        placeholder="correo@ejemplo.com"
                        value="{{ email_value|default:'' }}"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn-submit"
                    id="passwordResetRequestSubmit"
                    {% if rate_limit_error %}
                        disabled
                    {% endif %}
                >
                    <i
                        class="bi bi-send"
                        aria-hidden="true"
                    ></i>

                    Enviar código
                </button>
            </form>

            <div class="back">
                <a href="{% url 'login_custom' %}">
                    <i
                        class="bi bi-arrow-left"
                        aria-hidden="true"
                    ></i>

                    Volver al inicio de sesión
                </a>
            </div>

        </section>
    </main>

    <script>
        const rateLimitAlert =
            document.getElementById(
                "rateLimitAlert"
            );

        const countdownText =
            document.getElementById(
                "rateLimitCountdownText"
            );

        const submitButton =
            document.getElementById(
                "passwordResetRequestSubmit"
            );

        if (
            rateLimitAlert &&
            countdownText
        ) {
            let secondsRemaining =
                parseInt(
                    rateLimitAlert.dataset.retryAfter ||
                    "0",
                    10
                );

            const renderCountdown =
                function () {
                    if (secondsRemaining <= 0) {
                        countdownText.textContent =
                            "Ya puedes volver a intentarlo";

                        if (submitButton) {
                            submitButton.disabled = false;
                        }

                        return false;
                    }

                    const minutes =
                        Math.floor(
                            secondsRemaining / 60
                        );

                    const seconds =
                        secondsRemaining % 60;

                    const formattedSeconds =
                        String(seconds).padStart(
                            2,
                            "0"
                        );

                    countdownText.textContent =
                        minutes > 0
                            ? `Intenta nuevamente en ${minutes}:${formattedSeconds}`
                            : `Intenta nuevamente en ${seconds}s`;

                    return true;
                };

            renderCountdown();

            const interval = setInterval(
                function () {
                    secondsRemaining -= 1;

                    if (!renderCountdown()) {
                        clearInterval(interval);
                    }
                },
                1000
            );
        }
    </script>
</body>

</html>
