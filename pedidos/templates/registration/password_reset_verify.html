<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verificar código | FoodBack</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    >

    <style>
        :root {
            --fb-orange: #D35400;
            --fb-dark: #1D232A;
            --fb-muted: #7F8790;
            --fb-bg: #F5F6F8;
            --fb-border: #E5E8EB;
            --fb-danger: #D9485F;
            --fb-success: #26865C;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(211, 84, 0, 0.06),
                    transparent 30%
                ),
                var(--fb-bg);

            font-family: "Poppins", sans-serif;
            color: var(--fb-dark);
        }

        .shell {
            width: 100%;
            max-width: 430px;
        }

        .card-verify {
            padding: 38px;

            background: white;
            border-radius: 26px;

            box-shadow:
                0 24px 70px
                rgba(32, 41, 50, 0.09);
        }

        .header {
            margin-bottom: 25px;
            text-align: center;
        }

        .icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #E46A19,
                    var(--fb-orange)
                );

            color: white;
            font-size: 1.4rem;
        }

        h1 {
            margin: 0 0 7px;

            font-size: 1.35rem;
            font-weight: 800;
        }

        .description {
            margin: 0;

            color: var(--fb-muted);

            font-size: 0.74rem;
            line-height: 1.6;
        }

        .message {
            margin-bottom: 18px;
            padding: 13px 15px;

            border-radius: 13px;

            font-size: 0.72rem;
            font-weight: 600;

            line-height: 1.55;
        }

        .message-error {
            background:
                rgba(217, 72, 95, 0.08);

            color:
                #B2384C;
        }

        .message-success {
            background:
                rgba(38, 134, 92, 0.09);

            color:
                var(--fb-success);
        }

        label {
            display: block;

            margin:
                0
                0
                7px
                2px;

            color: #69727C;

            font-size: 0.68rem;
            font-weight: 700;
        }

        .code-input {
            width: 100%;
            height: 58px;

            border:
                1.5px solid
                var(--fb-border);

            border-radius: 14px;

            background: #F8F9FA;

            text-align: center;

            font-family:
                monospace;

            font-size: 1.45rem;
            font-weight: 700;

            letter-spacing: 8px;
        }

        .code-input:focus {
            outline: none;

            border-color:
                var(--fb-orange);

            box-shadow:
                0 0 0 4px
                rgba(211, 84, 0, 0.075);
        }

        .btn-submit {
            width: 100%;
            height: 52px;

            margin-top: 17px;

            border: none;
            border-radius: 14px;

            background:
                var(--fb-dark);

            color: white;

            font-size: 0.88rem;
            font-weight: 700;
        }

        .back {
            margin-top: 20px;
            text-align: center;
        }

        .back a {
            color: #818991;

            font-size: 0.72rem;

            text-decoration: none;
        }

        .back a:hover {
            color:
                var(--fb-orange);
        }

        @media (max-width: 576px) {
            body {
                align-items: flex-start;
                padding: 26px 16px;
            }

            .card-verify {
                margin-top: 7vh;
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="card-verify">

            <div class="header">
                <div class="icon">
                    <i
                        class="bi bi-shield-lock-fill"
                        aria-hidden="true"
                    ></i>
                </div>

                <h1>
                    Verifica tu código
                </h1>

                <p class="description">
                    {{ mensaje_generico }}
                </p>
            </div>

            {% if codigo_error %}
                <div
                    class="message message-error"
                    role="alert"
                >
                    <i
                        class="bi bi-exclamation-circle-fill"
                        aria-hidden="true"
                    ></i>

                    {{ codigo_error }}
                </div>
            {% endif %}

            {% if codigo_verificado %}
                <div
                    class="message message-success"
                    role="status"
                >
                    <i
                        class="bi bi-check-circle-fill"
                        aria-hidden="true"
                    ></i>

                    Código verificado correctamente.
                    Tu identidad fue validada de forma segura.
                </div>

                <div class="back">
                    <a href="{% url 'login_custom' %}">
                        Volver al inicio de sesión
                    </a>
                </div>

            {% else %}

                <form
                    method="post"
                    novalidate
                >
                    {% csrf_token %}

                    <label for="id_codigo">
                        Código de 6 dígitos
                    </label>

                    <input
                        type="text"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        minlength="6"
                        autocomplete="one-time-code"
                        name="codigo"
                        id="id_codigo"
                        class="code-input"
                        placeholder="000000"
                        required
                    >

                    <button
                        type="submit"
                        class="btn-submit"
                    >
                        <i
                            class="bi bi-check2-circle"
                            aria-hidden="true"
                        ></i>

                        Verificar código
                    </button>
                </form>

                <div class="back">
                    <a
                        href="{% url 'password_reset_request' %}"
                    >
                        <i
                            class="bi bi-arrow-left"
                            aria-hidden="true"
                        ></i>

                        Solicitar otro código
                    </a>
                </div>

            {% endif %}

        </section>
    </main>
</body>

</html>
